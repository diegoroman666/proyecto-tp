# Despliegue continuo del sitio en GitHub Pages.
#
# Cada empuje a main publica el repositorio tal cual: no hay compilacion ni
# dependencias que instalar, porque el sitio es HTML plano. La raiz es
# index.html, que redirige a proyecto-tp.html conservando el ancla.
name: Desplegar el sitio

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestana Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega uno nuevo mientras corre otro, gana el nuevo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        # enablement activa Pages la primera vez, sin tocar la configuracion a mano
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
